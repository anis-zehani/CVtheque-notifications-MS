#################### Deployment ####################
---
apiVersion: apps/v1 # for versions before 1.9.0 use apps/v1beta2
kind: Deployment
metadata:
  name: notifications-deployment
  labels:
    app: notifications
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notifications
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: notifications
    spec:
      containers:
      - name: notifications-container
        image: registry.gitlab.com/gitlabodix/cvtheque-notifications-ms-prod
        args: ["--spring.profiles.active=prod"]
        imagePullPolicy: Always
        ports:
        - containerPort: 8004
      imagePullSecrets:
      - name: gitlab-secrets-notifications-ms
#################### Service ####################
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-ms
spec:
  selector:
    app: notifications
  ports:
    - port: 8004
      targetPort: 8004

